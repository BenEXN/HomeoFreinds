<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeoSphere Tamagotchi - Chapitre H1</title>
    <meta name="description" content="Tester l'économie homéostatique avec un Tamagotchi écologique">
    <link rel="stylesheet" href="style.css">
    <!-- Phaser doit être en premier -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
    <header>
        <div class="title">HomeoSphere Tamagotchi</div>
        <div class="version">Chapitre H1 v1.0</div>
    </header>

    <main>
        <div id="game-container">
            <!-- [Votre contenu existant...] -->
        </div>

        <!-- Ajout des conteneurs de stats -->
        <div id="stats-container">
            <div>
                <div class="economy-label">
                    <span>Mode économique:</span>
                    <span class="economy-mode" id="economy-mode">Standard</span>
                </div>
                <div>
                    <label>Confort</label>
                    <div class="stat-bar">
                        <div class="stat-fill" id="comfort-fill" style="width: 50%;"></div>
                    </div>
                </div>
                <div>
                    <label>Écologie</label>
                    <div class="stat-bar">
                        <div class="stat-fill" id="ecology-fill" style="width: 70%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="action-container">
            <div id="day-indicator">Jour 1 - Actions restantes: 7</div>
            <div id="cards-container">
                <!-- Les cartes seront ajoutées ici par JS -->
            </div>
        </div>

        <!-- Écrans -->
        <div id="welcome-screen">
            <div class="screen-content">
                <h2>Bienvenue dans HomeoSphere Tamagotchi</h2>
                <button class="button" id="start-button">Commencer</button>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/init.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
